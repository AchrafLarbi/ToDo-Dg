<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion - Gestion des Tâches</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen font-['Plus_Jakarta_Sans',sans-serif] flex items-center justify-center p-4">

<div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl shadow-indigo-950/50">
  <div class="text-center mb-8">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="w-16 h-16 rounded-2xl mx-auto mb-4 object-cover shadow-xl shadow-indigo-500/20 border border-slate-700/80">
    <h1 class="text-2xl font-extrabold text-white tracking-tight">Gestion des Tâches</h1>
    <p class="text-slate-400 text-sm mt-1">Connectez-vous à l'espace administration</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="space-y-2 mb-6">
        {% for category, message in messages %}
          <div class="p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm font-medium">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="post" class="space-y-5">
    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Mot de passe administrateur</label>
      <input type="password" name="password" placeholder="••••••••••••" required autofocus class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm">
    </div>
    
    <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 group">
      <span>Se connecter</span>
      <svg class="w-4 h-4 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
    </button>
  </form>
</div>

</body>
</html>
